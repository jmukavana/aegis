global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]  # app metrics exported by the collector
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]  # collector's own telemetry
